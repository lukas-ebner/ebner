meta:
  title: "Business-Coaching Regensburg | Coach für Unternehmer"
  description: "Business-Coaching in Regensburg für Unternehmer, Geschäftsführer und Inhaber von KMU in Ostbayern. Systemischer Coach (ICO) mit 13 Jahren eigener Geschäftsführung. Vor Ort in der Yorckstraße oder per Video."
  kicker: "Business-Coaching Regensburg"
  subtitle: "Wer in Regensburg nach einem Coach sucht, findet viel Lebensberatung und wenig Unternehmerpraxis. Ich coache Unternehmer, Geschäftsführer und Inhaber aus Regensburg und Ostbayern, die ihr Unternehmen führen wollen, ohne dass es an ihnen hängt. Ich bin systemischer Coach (ICO) und habe 13 Jahre selbst ein Unternehmen mit bis zu 50 Mitarbeitenden geführt und verkauft. Die Sessions finden in meinem Büro in der Yorckstraße 22 statt oder per Video."
  heroImage: /images/lukas-meetingraum.jpg
  heroAlt: "Lukas Ebner, Business Coach in Regensburg, im Besprechungsraum"
  og_image: /images/og/geo-landingpage.jpg
  breadcrumbs:
    - label: "Start"
      href: "/"
    - label: "Business-Coaching Regensburg"
      href: "/business-coaching-regensburg"
