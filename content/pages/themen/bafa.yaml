"sections":
- "type": "prose"
  "heading": "Kurz gesagt: BAFA-Förderung für Unternehmensberatung in Bayern"
  "content":
  - "Das BAFA fördert Unternehmensberatung für kleine und mittlere Unternehmen mit einem Zuschuss. In Bayern und den übrigen\
    \ alten Bundesländern sind das 50 Prozent der förderfähigen Beratungskosten bis 3.500 Euro, also höchstens 1.750 Euro\
    \ je Beratung. In den neuen Bundesländern (ohne Berlin und Region Leipzig) sowie in den Regionen Lüneburg und Trier sind\
    \ es 80 Prozent, höchstens 2.800 Euro. Pro Unternehmen sind bis zu zwei Beratungen im Jahr und fünf während der gesamten\
    \ Laufzeit förderfähig. Die Richtlinie gilt bis zum 31. Dezember 2028 (maßgeblich ist die Einreichung des Verwendungsnachweises).\
    \ Wichtig: Der Antrag muss gestellt sein, bevor du den Beratungsvertrag schließt. Ab dem 1. Januar 2027 stellst du ihn\
    \ nur noch digital mit ELSTER-Konto oder BundID."
  - "Die Wachstumscoach GmbH (Lukas Ebner, Regensburg) ist als Beratungsunternehmen für das Programm registriert. Ich prüfe\
    \ im Erstgespräch, ob dein Vorhaben förderfähig ist, und begleite Antrag, Beratung und Verwendungsnachweis."
- "type": "prose"
  "heading": "BAFA-geförderte Beratung mit ICO-zertifiziertem Berater"
  "content":
  - "Ich bin seit 2025 zertifizierter ICO Organisationsberater und Change Manager sowie zertifizierter systemischer Coach.\
    \ Diese Qualifikationen stehen für die methodischen Voraussetzungen, die BAFA an Berater stellt. Als BAFA-registrierter\
    \ Berater kann ich Beratungsleistungen direkt mit der Förderlogik verbinden. Das bedeutet: Wenn BAFA passt, stellen wir\
    \ den Antrag vor Beginn und arbeiten dann strukturiert. Wenn BAFA nicht passt, sage ich das klar. Ich berate nicht so,\
    \ dass ein Antrag erzwungen wird, sondern so, dass ein Beratungsziel sinnvoll ist, egal ob gefördert oder nicht. Hinter\
    \ beiden Zertifizierungen steckt echte Lernarbeit, keine Briefkastenzertifikate. Das gibt den Beratungsleistungen, die\
    \ BAFA fördert, eine methodische Substanz, die den Verwendungsnachweis trägt."
  "bullets":
